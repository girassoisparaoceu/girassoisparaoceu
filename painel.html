<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Cadastro - Achadinhos</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f9f9f9;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 500px; 
      margin: 20px auto; 
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #4a4a4a;
      margin-bottom: 25px;
    }
    form { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }
    label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: -10px;
      color: #666;
    }
    input, select, textarea, button { 
      padding: 12px; 
      font-size: 15px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #d4a34b;
    }
    textarea { 
      resize: vertical; 
      min-height: 80px; 
      font-family: inherit;
    }
    .btn-submit { 
      background-color: #d4a34b; 
      color: #fff;
      font-weight: bold; 
      font-size: 16px;
      cursor: pointer; 
      border: none; 
      margin-top: 10px;
      transition: background-color 0.3s;
    }
    .btn-submit:hover { 
      background-color: #b88a38; 
    }
    .btn-submit:disabled, .btn-ia:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #mensagem {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
    
    /* Estilo da caixa de IA */
    .ia-box {
      background: #f0f8ff; 
      padding: 15px; 
      border-radius: 8px; 
      margin-bottom: 25px; 
      border: 1px dashed #bfdbfe;
    }
    .ia-box label {
      color: #3b82f6; 
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
      display: block;
    }
    .btn-ia {
      background: #3b82f6; 
      color: white; 
      width: 100%;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-ia:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌻 Cadastrar Achadinho</h2>
    
    <!-- MÓDULO DE INTELIGÊNCIA ARTIFICIAL -->
    <div class="ia-box">
      <label for="imagemIA">🤖 Preenchimento Automático com IA</label>
      <span style="display: block; font-size: 12px; color: #666; margin-bottom: 12px;">
        Anexe um print do produto. A IA vai preencher o Nome, Categoria e Descrição sozinha!
      </span>
      <input type="file" id="imagemIA" accept="image/*" style="background: white; width: 100%; box-sizing: border-box;">
      <button type="button" id="btnLerImagem" class="btn-ia">✨ Analisar Imagem e Preencher</button>
    </div>
    
    <!-- FORMULÁRIO PRINCIPAL -->
    <form id="formProduto">
      <label for="nome">Nome do Produto</label>
      <input type="text" id="nome" placeholder="Ex: Bíblia de Estudo" required>
      
      <label for="categoria">Categoria</label>
      <select id="categoria" required>
        <option value="">Selecione...</option>
        <option value="Devoção">Devoção</option>
        <option value="Casa">Casa</option>
        <option value="Utilidades">Utilidades</option>
        <option value="Acessórios">Acessórios</option>
        <option value="Presentes">Presentes</option>
           <option value="Moda">Moda</option>
      </select>
      
      <label for="imagem">Link da Imagem (URL da Loja)</label>
      <input type="url" id="imagem" placeholder="https://..." required>
      
      <label for="descricao">Descrição</label>
      <textarea id="descricao" placeholder="Escreva uma breve descrição..." required></textarea>
      
      <label for="link">Link de Afiliado</label>
      <input type="url" id="link" placeholder="https://amzn.to/..." required>
      
      <label for="senha">Senha de Acesso da Planilha</label>
      <input type="password" id="senha" placeholder="Sua senha secreta" required>
      
      <button type="submit" id="btnSalvar" class="btn-submit">Salvar Produto na Planilha</button>
    </form>

    <p id="mensagem"></p>
  </div>

  <script>
    // ==========================================
    // 1. LÓGICA DA IA (GEMINI) PARA LER A IMAGEM
    // ==========================================
    document.getElementById('btnLerImagem').addEventListener('click', async () => {
      const fileInput = document.getElementById('imagemIA');
      const btnLer = document.getElementById('btnLerImagem');

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Por favor, selecione uma imagem ou tire um print do produto primeiro!");
        return;
      }

      let apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        apiKey = prompt("Cole sua NOVA chave de API do Google Gemini aqui:\n(Ela ficará salva no seu navegador)");
        if (apiKey) localStorage.setItem('gemini_api_key', apiKey);
        else return;
      }

      btnLer.textContent = "⏳ Analisando imagem (aguarde uns segundos)...";
      btnLer.disabled = true;

      const file = fileInput.files[0];
      const reader = new FileReader();
      
      reader.onloadend = async () => {
        const base64String = reader.result.split(',')[1];
        
        const promptText = `
          Analise a imagem deste produto e retorne os dados no formato JSON exato abaixo. 
          Regras: 
          1. 'nome': crie um título curto e comercial para o produto.
          2. 'categoria': escolha OBRIGATORIAMENTE uma destas opções exatas: "Devoção", "Casa", "Utilidades", "Acessórios" ou "Presentes".
          3. 'descricao': crie uma descrição curta, afetiva, delicada (máx 2 frases) para um site cristão chamado 'Girassóis para o Céu'.
          
          Retorne APENAS um JSON válido, sem texto antes ou depois, sem aspas triplas de formatação markdown.
          Exemplo: {"nome": "Terço de Madeira", "categoria": "Devoção", "descricao": "Um lindo terço..."}
        `;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
          method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inlineData: { mimeType: file.type, data: base64String } }
                ]
              }]
            })
          });

          const data = await response.json();

          if (data.error) {
            alert("Erro na IA: " + data.error.message);
            if (data.error.code === 400) localStorage.removeItem('gemini_api_key'); 
          } else {
            let textoResposta = data.candidates[0].content.parts[0].text;
            textoResposta = textoResposta.replace(/```json/g, "").replace(/```/g, "").trim();
            
            const produtoAnalisado = JSON.parse(textoResposta);

            document.getElementById('nome').value = produtoAnalisado.nome || "";
            document.getElementById('categoria').value = produtoAnalisado.categoria || "";
            document.getElementById('descricao').value = produtoAnalisado.descricao || "";
            
            alert("✨ Mágica feita! Campos preenchidos com sucesso. Agora só falta colocar os links.");
          }
        } catch (err) {
          alert("Erro ao processar. Tente uma imagem mais leve ou verifique se a chave API está correta.");
          console.error(err);
        } finally {
          btnLer.textContent = "✨ Analisar Imagem e Preencher";
          btnLer.disabled = false;
        }
      };
      
      reader.readAsDataURL(file);
    });

    // ==========================================
    // 2. LÓGICA PARA SALVAR NA PLANILHA
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbz1ZBE8fHeQpF4w8tn85nbhLpn_YOpa_Leg5tm53NoISLOOxM7oTnnZDekWJlb0TIVU/exec";

    document.getElementById('formProduto').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSalvar');
      const msg = document.getElementById('mensagem');
      
      btn.disabled = true;
      msg.textContent = "⏳ Salvando na planilha...";
      msg.style.color = "#666";

      const produto = {
        nome: document.getElementById('nome').value,
        categoria: document.getElementById('categoria').value,
        imagem: document.getElementById('imagem').value,
        descricao: document.getElementById('descricao').value,
        link: document.getElementById('link').value,
        senha: document.getElementById('senha').value
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify(produto)
        });

        const result = await response.json();

        if (result.status === 'sucesso') {
          msg.textContent = "✅ Achadinho salvo com sucesso!";
          msg.style.color = "green";
          document.getElementById('formProduto').reset();
          document.getElementById('imagemIA').value = ""; // Limpa a imagem anexada também
        } else {
          msg.textContent = "❌ Erro: " + result.message;
          msg.style.color = "red";
        }
      } catch (err) {
        msg.textContent = "✅ Produto enviado! (Verifique a planilha)";
        msg.style.color = "green";
        document.getElementById('formProduto').reset();
        document.getElementById('imagemIA').value = "";
      } finally {
        btn.disabled = false;
        setTimeout(() => { msg.textContent = ""; }, 5000);
      }
    });
  </script>
</body>
</html>
